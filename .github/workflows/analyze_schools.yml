name: Analyze D1 Swimming Schools

on:
  schedule:
    - cron: '0 4 * * 0'  # Weekly Sunday 11 PM EST
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: |
          pip install --break-system-packages requests beautifulsoup4 python-docx
          python3 d1_recruiting_analyzer_workflow.py
